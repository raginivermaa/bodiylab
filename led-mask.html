<div style="display: flex; flex-direction: column; gap: 14px; max-width: 760px">
<div style="font-family: Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 12px; letter-spacing: 0.24em; text-transform: uppercase; color: #2B2629">Engineered for the glow</div>
<h2 style="margin: 0; font-family: 'Inter Tight', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-weight: 300; font-size: clamp(46px, 5.8vw, 80px); line-height: 1">Couture-grade light. <em style="font-weight: 400; color: #2B2629">Effortless ritual.</em></h2>
<p style="margin: 0; font-size: 18px; line-height: 1.6; color: #5A514B">Every detail of the LED Light Therapy Mask is tuned for one thing: luminous, even light that reaches every contour of your face — while you get on with your life.</p>
</div>

<div style="background: #FFFFFF; color: #2B2629; border-radius: 20px; box-shadow: 0 24px 60px rgba(43,38,41,0.06); padding: clamp(32px, 5vw, 64px); display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 40px">
<div style="display: flex; flex-direction: column; gap: 14px; border-top: 1px solid rgba(43,38,41,0.227); padding-top: 24px">
<span class="bl-grad m-big" style="font-family: 'Inter Tight', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 52px; line-height: 1">4 wavelengths</span>
<h3 style="margin: 0; font-family: Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 500; letter-spacing: 0.22em; text-transform: uppercase">Science-backed spectrum</h3>
<p style="margin: 0; font-size: 15px; line-height: 1.65; color: #5A514B">415, 590, 660 and 850 nm — the precise wavelengths most studied in dermatology research for clearer, smoother, more radiant-looking skin. No guesswork, just the light that matters.</p>
</div>
<div style="display: flex; flex-direction: column; gap: 14px; border-top: 1px solid rgba(43,38,41,0.227); padding-top: 24px">
<span class="bl-grad m-big" style="font-family: 'Inter Tight', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 52px; line-height: 1">Anti-acne</span>
<h3 style="margin: 0; font-family: Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 500; letter-spacing: 0.22em; text-transform: uppercase">Dedicated blemish mode</h3>
<p style="margin: 0; font-size: 15px; line-height: 1.65; color: #5A514B">A targeted blue-light mode for your skin's most demanding moments — those pre-period breakouts and the days after an extraction facial, when skin needs calm, clarifying care.</p>
</div>
<div style="display: flex; flex-direction: column; gap: 14px; border-top: 1px solid rgba(43,38,41,0.227); padding-top: 24px">
<span class="bl-grad m-big" style="font-family: 'Inter Tight', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 52px; line-height: 1">Soft &amp; 0.36 kg</span>
<h3 style="margin: 0; font-family: Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 500; letter-spacing: 0.22em; text-transform: uppercase">Made to travel</h3>
<p style="margin: 0; font-size: 15px; line-height: 1.65; color: #5A514B">A soft, flexible mask that moulds to your face and slips straight into its satin pouch. From carry-on to hotel suite, your glow never takes a day off.</p>
</div>

<div style="font-family: Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; color: #2B2629">Hands-free</div>
<h3 style="margin: 0; font-family: 'Inter Tight', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 30px; font-weight: 300; line-height: 1.1">Strap on, clip on</h3>
<p style="margin: 0; font-size: 15px; line-height: 1.65; color: #5A514B">Soft, adjustable velcro straps lock the mask in place in seconds, and the wired controller clips onto your clothing, so both hands stay free. Scroll, sip, stretch, answer emails while your glow keeps working.</p>
</article>
<article class="m-card" style="background: #FFFFFF; border: 1px solid rgba(43,38,41,0.08); border-radius: 16px; padding: 32px; display: flex; flex-direction: column; gap: 12px">
<div style="font-family: Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; color: #2B2629">Automatic timer</div>
<h3 style="margin: 0; font-family: 'Inter Tight', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 30px; font-weight: 300; line-height: 1.1">Set it. Forget it.</h3>
<p style="margin: 0; font-size: 15px; line-height: 1.65; color: #5A514B">A built-in smart timer powers down the moment your session is complete. No clock-watching, no overdoing it — just perfectly dosed light, every time.</p>
</article>

<h3 style="margin: 0; font-family: 'Inter Tight', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 30px; font-weight: 300; line-height: 1.1">A spectrum on demand</h3>
<p style="margin: 0; font-size: 15px; line-height: 1.65; color: #5A514B">Glide between modes at the touch of a button. Clarify on Monday, calm on Wednesday, renew on Sunday — one mask, tailored to your skin's mood.</p>
</article>
<article class="m-card" style="background: #FFFFFF; border: 1px solid rgba(43,38,41,0.08); border-radius: 16px; padding: 32px; display: flex; flex-direction: column; gap: 12px">
<div style="font-family: Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; color: #2B2629">Frosted diffusion</div>
<h3 style="margin: 0; font-family: 'Inter Tight', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 30px; font-weight: 300; line-height: 1.1">Zero glare, zero hotspots</h3>
<p style="margin: 0; font-size: 15px; line-height: 1.65; color: #5A514B">A light-diffusing frosted interior melts every point of light into one seamless, velvet-soft wash — an even, full-face glow, edge to edge.</p>
</article>
<article class="m-card" style="background: #FFFFFF; border: 1px solid rgba(43,38,41,0.08); border-radius: 16px; padding: 32px; display: flex; flex-direction: column; gap: 12px">
<div style="font-family: Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; color: #2B2629">High-density array</div>
<h3 style="margin: 0; font-family: 'Inter Tight', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 30px; font-weight: 300; line-height: 1.1">368 diodes of precision</h3>
<p style="margin: 0; font-size: 15px; line-height: 1.65; color: #5A514B">Four diodes in every cluster, so every wavelength reaches every zone from brow to jawline. No patchwork, no blind spots.</p>
</article>
<article class="m-card" style="background: #FFFFFF; border: 1px solid rgba(43,38,41,0.08); border-radius: 16px; padding: 32px; display: flex; flex-direction: column; gap: 12px">

<h3 style="margin: 0; font-family: 'Inter Tight', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 30px; font-weight: 300; line-height: 1.1">Clip on, press play</h3>
<p style="margin: 0; font-size: 15px; line-height: 1.65; color: #5A514B">Clip the controller to your clothing, choose a mode and let the timer take over. Recharge over USB-C, with no wall plug tying you down.</p>

<script>
class Component extends DCLogic {
  renderVals() {
    return Object.assign({}, this._pageVals(), this._navVals());
  }
  _navVals() {
    const st = this.state || {};
    const cats = st.navCats || { led: true, us: false };
    const toggle = (k) => () => this.setState({ navCats: Object.assign({}, cats, { [k]: !cats[k] }) });
    const chev = (open) => 'display: block; flex: 0 0 auto; transition: transform 0.2s ease; transform: rotate(' + (open ? '180' : '0') + 'deg)';
    return {
      navOpen: !!st.navOpen,
      openNav: () => this.setState({ navOpen: true }),
      closeNav: () => this.setState({ navOpen: false }),
      navLedOpen: !!cats.led,
      navUsOpen: !!cats.us,
      toggleLed: toggle('led'),
      toggleUs: toggle('us'),
      ledChevron: chev(!!cats.led),
      usChevron: chev(!!cats.us)
    };
  }
  constructor(props) {
    super(props);
    this.state = { picked: 'blush', openFaq: 0 };
  }
  _pageVals() {
    const price = this.props.price ?? '$349';
    const compareAt = this.props.compareAt ?? '$599';
    const p = parseFloat(String(price).replace(/[^0-9.]/g, '')) || 0;
    const c = parseFloat(String(compareAt).replace(/[^0-9.]/g, '')) || 0;
    const saving = '$' + Math.max(0, Math.round(c - p));
    const ways = [
      { id: 'ice', name: 'Pearl Ice', hex: '#AFC6D8', img: 'assets/img/mask-pearl-ice.jpg' },
      { id: 'sage', name: 'Sage', hex: '#B9CDBE', img: 'assets/img/mask-sage.jpg' },
      { id: 'blush', name: 'Blush', hex: '#F1C9C4', img: 'assets/img/mask-blush.jpg' },
      { id: 'champagne', name: 'Champagne', hex: '#EBDCC6', img: 'assets/img/mask-champagne.jpg' }
    ];
    const colorways = ways.map((w) => {
      const selected = w.id === this.state.picked;
      return {
        ...w,
        selected,
        pick: () => this.setState({ picked: w.id }),
        swatchStyle: 'width: 44px; height: 44px; border-radius: 50%; cursor: pointer; padding: 0; background: ' + w.hex + '; border: 2px solid #FFFFFF; box-shadow: 0 0 0 2px ' + (selected ? '#2B2629' : 'rgba(43,38,41,0.163)'),
        thumbStyle: 'aspect-ratio: 1 / 1; padding: 0; border-radius: 16px; overflow: hidden; cursor: pointer; background: #FFFFFF; border: 2px solid ' + (selected ? '#2B2629' : 'transparent') + '; opacity: ' + (selected ? '1' : '0.62')
      };
    });
    const cur = ways.find((w) => w.id === this.state.picked) || ways[0];
    const current = { ...cur, alt: 'Bodiy Lab LED light therapy mask in ' + cur.name + ' with matching strap, cable and satin pouch' };
    const qa = [
      { q: 'How long does one charge last?', a: 'About 1 hour 10 minutes of use from the controller\'s 2000 mAh battery. Recharging the controller over USB-C takes around 3 hours 30 minutes.' },
      { q: 'Can I move around while wearing it?', a: 'Yes, within reach of its cable. The mask is wired to a rechargeable controller that clips onto your clothing, so there\'s no wall plug and your hands stay free. The velcro straps keep the mask in place.' },
      { q: 'Do I need to time my sessions?', a: 'No. The built-in automatic timer switches the mask off when your session is done.' },
      { q: 'What do the four lights do?', a: 'Blue (415 nm), yellow (590 nm), red (660 nm) and near-infrared (850 nm). Each is a different setting for a different skin mood, and every LED carries all four.' },
      { q: 'Don\'t more LEDs mean better results?', a: 'Not on their own. What matters is the right wavelengths, how many diodes deliver each one, and how evenly the light reaches your skin. The mask packs four diodes into every LED, so all 92 points deliver every wavelength: 368 diodes in total.' },
      { q: 'What warranty do I get?', a: 'Every mask comes with a 2-year warranty.' }
    ];
    const faqs = qa.map((f, i) => ({
      ...f,
      open: this.state.openFaq === i,
      icon: this.state.openFaq === i ? '−' : '+',
      toggle: () => this.setState({ openFaq: this.state.openFaq === i ? -1 : i })
    }));
    const results = [
      { title: 'Clarity', meta: '[Customer first name] · after [X] weeks of Blue mode' },
      { title: 'Even tone', meta: '[Customer first name] · after [X] weeks of Yellow mode' },
      { title: 'Smoother texture', meta: '[Customer first name] · after [X] weeks of Red + NIR' }
    ];
    const hues = ['#5C7CFF', '#F4C552', '#EA4A3C', '#9C3B58'];
    const singleDots = Array.from({ length: 32 }, (_, i) => {
      const c = hues[(i + Math.floor(i / 8)) % 4];
      return { style: 'display: block; aspect-ratio: 1 / 1; max-width: 22px; width: 100%; justify-self: center; border-radius: 50%; background: ' + c + '; opacity: 0.8; box-shadow: 0 0 6px ' + c + '66' };
    });
    const quadDots = Array.from({ length: 32 }, (_, i) => ({ i }));
    return { price, compareAt, saving, colorways, current, faqs, results, singleDots, quadDots };
  }
}
mountPage(Component);
</script>
</body>
