<script>
class Component extends DCLogic {
  renderVals() {
    return Object.assign({}, this._pageVals(), this._navVals());
  }
  _navVals() {
    const st = this.state || {};
    const cats = st.navCats || { led: false, us: true };
    const toggle = (k) => () => this.setState({ navCats: Object.assign({}, cats, { [k]: !cats[k] }) });
    const chev = (open) => 'display: block; flex: 0 0 auto; transition: transform 0.2s ease; transform: rotate(' + (open ? '180' : '0') + 'deg)';
    return {
      navOpen: !!st.navOpen,
      openNav: () => this.setState({ navOpen: true }),
      closeNav: () => this.setState({ navOpen: false }),
      navLedOpen: !!cats.led,
      navUsOpen: !!cats.us,
      toggleLed: toggle('led'),
      toggleUs: toggle('us'),
      ledChevron: chev(!!cats.led),
      usChevron: chev(!!cats.us)
    };
  }
  constructor(props) {
    super(props);
    this.state = { email: '', joined: false };
  }
  _pageVals() {
    return {
      email: this.state.email,
      joined: this.state.joined,
      notJoined: !this.state.joined,
      onEmail: (e) => this.setState({ email: e.target.value }),
      join: (e) => { e.preventDefault(); if (String(this.state.email).indexOf('@') > 0) this.setState({ joined: true }); }
    };
  }
}
mountPage(Component);
</script>
